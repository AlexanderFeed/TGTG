name: eshche-est

services:
  api:
    image: eshche-est-api:${APP_VERSION:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      API_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
      OTP_EXPIRY: ${OTP_EXPIRY:-10m}
      OTP_COOLDOWN: ${OTP_COOLDOWN:-1m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SESSION_TTL: ${SESSION_TTL:-720h}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-smtp}
      EXPOSE_DEV_CODES: ${EXPOSE_DEV_CODES:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

  web:
    image: eshche-est-web:${APP_VERSION:-latest}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_API_INTERNAL_URL: http://api:8080
